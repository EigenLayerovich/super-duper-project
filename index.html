<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Telegram Mini App bridge. Loaded only when Telegram opened the page (it passes tgWebAppData in
         the URL hash), so the normal web build makes no extra request. It must load before the app:
         the sign-in screen shows "Continue with Telegram" only when Telegram.WebApp.initData exists. -->
    <script>
      if (/tgWebApp(Data|Platform)/.test(location.hash + location.search))
        document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    </script>
    <title>Dala Batyrs · Steppe idle on Solana</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        /* The theme's default bgBottom (src/ui.config.ts); mountHost repaints it from the theme. */
        background: #0d1033;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
